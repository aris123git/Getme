<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nearby - Carte GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: #1e293b;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }
        h1 {
            color: white;
            margin-bottom: 8px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button.secondary {
            background: #475569;
        }
        .status {
            background: #1e293b;
            padding: 12px;
            border-radius: 16px;
            text-align: center;
            color: #94a3b8;
            margin-bottom: 16px;
        }
        .hidden {
            display: none;
        }
        #map {
            height: 350px;
            width: 100%;
            border-radius: 20px;
            margin-top: 16px;
            background: #1e293b;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>📍 Nearby - Test Carte</h1>
        <p>Activez le GPS pour voir votre position sur la carte</p>
    </div>

    <div class="card">
        <div id="gpsStatus" class="status">📍 Cliquez sur "Activer GPS"</div>
        <button id="enableGpsBtn">📍 Activer GPS</button>
        <button id="stopGpsBtn" class="secondary hidden">🛑 Arrêter</button>
        <button id="centerMapBtn" class="secondary" style="margin-top:8px;">🎯 Centrer sur moi</button>
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ========== VARIABLES ==========
    let map = null;
    let userMarker = null;
    let watchId = null;
    let currentPosition = null;

    // ========== FONCTIONS ==========
    function initMap(lat, lng) {
        if (map) return;
        map = L.map('map').setView([lat, lng], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        console.log("Carte créée");
    }

    function updateUserMarker(lat, lng) {
        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker([lat, lng], {
            icon: L.divIcon({
                html: '<div style="background:#3b82f6;width:20px;height:20px;border-radius:50%;border:3px solid white;box-shadow:0 0 10px #3b82f6;"></div>',
                iconSize: [20, 20]
            })
        }).addTo(map).bindPopup('<b>Vous</b>').openPopup();
        map.setView([lat, lng], 15);
        console.log("Position mise à jour:", lat, lng);
    }

    function startGeolocation() {
        if (!navigator.geolocation) {
            document.getElementById('gpsStatus').innerHTML = "❌ GPS non supporté";
            return;
        }
        if (watchId) stopGeolocation();

        document.getElementById('gpsStatus').innerHTML = "🟢 Recherche GPS...";
        document.getElementById('enableGpsBtn').style.display = 'none';
        document.getElementById('stopGpsBtn').style.display = 'block';

        watchId = navigator.geolocation.watchPosition(
            function(position) {
                currentPosition = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };
                document.getElementById('gpsStatus').innerHTML = "✅ GPS actif : " + currentPosition.lat.toFixed(4) + ", " + currentPosition.lng.toFixed(4);

                if (!map) initMap(currentPosition.lat, currentPosition.lng);
                updateUserMarker(currentPosition.lat, currentPosition.lng);
            },
            function(error) {
                document.getElementById('gpsStatus').innerHTML = "❌ Erreur GPS: " + error.message;
                stopGeolocation();
            },
            { enableHighAccuracy: true, maximumAge: 10000, timeout: 10000 }
        );
    }

    function stopGeolocation() {
        if (watchId) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        document.getElementById('gpsStatus').innerHTML = "📍 GPS arrêté";
        document.getElementById('enableGpsBtn').style.display = 'block';
        document.getElementById('stopGpsBtn').style.display = 'none';
    }

    function centerMap() {
        if (currentPosition && map) {
            map.setView([currentPosition.lat, currentPosition.lng], 15);
            document.getElementById('gpsStatus').innerHTML = "📍 Centré sur votre position";
        } else {
            document.getElementById('gpsStatus').innerHTML = "❌ Position non disponible";
        }
    }

    // ========== ÉVÉNEMENTS ==========
    document.getElementById('enableGpsBtn').onclick = startGeolocation;
    document.getElementById('stopGpsBtn').onclick = stopGeolocation;
    document.getElementById('centerMapBtn').onclick = centerMap;

    console.log("Application prête, boutons attachés");
</script>
</body>
</html>
