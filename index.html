<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nearby - Version Complète</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card {
            background: #1e293b;
            border-radius: 24px;
            padding: 20px;
            margin: 16px;
            border: 1px solid #334155;
        }
        h1, h2, h3 { color: white; margin-bottom: 16px; }
        input, textarea, select {
            width: 100%;
            padding: 14px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            margin-bottom: 12px;
        }
        button {
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        button.warning { background: #f59e0b; }
        button.secondary { background: #475569; }
        button.danger { background: #ef4444; }
        .hidden { display: none; }
        
        /* Carte */
        #map { height: 350px; border-radius: 20px; margin-bottom: 16px; }
        
        /* Profil */
        .profile-header {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 20px;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 40px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Messages */
        .chat-container {
            height: 300px;
            overflow-y: auto;
            background: #0f172a;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .message {
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 16px;
            max-width: 80%;
        }
        .message.sent {
            background: #3b82f6;
            margin-left: auto;
            text-align: right;
        }
        .message.received {
            background: #334155;
        }
        .message small { font-size: 10px; opacity: 0.7; display: block; }
        
        /* Utilisateur carte */
        .user-card {
            background: #0f172a;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .user-card-avatar {
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background: #334155;
            overflow: hidden;
        }
        .user-card-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Slider rayon */
        .radius-slider {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="range"] { flex: 1; }
        
        /* Notifications */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #22c55e;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            background: #334155;
            text-align: center;
            border-radius: 16px;
            cursor: pointer;
        }
        .tab.active { background: #3b82f6; }
        
        /* Badges */
        .badge {
            background: #22c55e;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Écran de connexion -->
    <div id="authScreen">
        <div class="card" style="text-align: center;">
            <h1>📍 Nearby</h1>
            <p style="color:#94a3b8;">Rencontrez des personnes proches de vous</p>
            <div id="authMsg"></div>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Mot de passe">
            <button id="signupBtn">📝 Créer un compte</button>
            <button id="loginBtn" class="secondary">🔑 Se connecter</button>
        </div>
    </div>

    <!-- Écran principal -->
    <div id="mainScreen" class="hidden">
        <!-- Barre supérieure -->
        <div class="card" style="margin-bottom: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="profile-header" style="margin-bottom: 0;">
                    <div class="avatar" id="profileAvatar" onclick="document.getElementById('avatarInput').click()">
                        👤
                    </div>
                    <input type="file" id="avatarInput" accept="image/*" style="display:none;">
                    <div>
                        <span id="userName" style="color:white; font-weight:600;"></span>
                        <div id="userBalance" style="font-size:12px; color:#f59e0b;">💰 0 FCFA</div>
                    </div>
                </div>
                <button id="logoutBtn" style="width:auto; padding:8px 16px; background:#ef4444;">Déconnexion</button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="card" style="margin-top: 0;">
            <div class="tabs">
                <div class="tab active" data-tab="map">🗺️ Carte</div>
                <div class="tab" data-tab="messages">💬 Messages</div>
                <div class="tab" data-tab="profile">👤 Profil</div>
            </div>

            <!-- Tab Carte -->
            <div id="mapTab">
                <div id="gpsStatus" style="background:#1e293b; padding:12px; border-radius:16px; margin-bottom:16px; text-align:center; color:#94a3b8;">
                    📍 Cliquez sur "Activer GPS"
                </div>
                <button id="enableGpsBtn">📍 Activer ma position</button>
                
                <div class="radius-slider" style="margin: 16px 0;">
                    <span style="color:white;">📏 Rayon:</span>
                    <input type="range" id="radiusKm" min="1" max="20" value="5" step="1">
                    <span id="radiusValue" style="color:white;">5 km</span>
                </div>
                
                <div id="map"></div>
                <div id="nearbyList"></div>
            </div>

            <!-- Tab Messages -->
            <div id="messagesTab" class="hidden">
                <div id="conversationsList" class="loading">Chargement...</div>
                <div id="chatView" class="hidden">
                    <div id="chatWith" style="color:white; margin-bottom:12px;"></div>
                    <div id="chatMessages" class="chat-container"></div>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="messageInput" placeholder="Votre message...">
                        <button id="sendMsgBtn" style="width:auto; padding:14px 20px;">📤</button>
                    </div>
                    <button id="closeChatBtn" class="secondary" style="margin-top:8px;">Fermer</button>
                </div>
            </div>

            <!-- Tab Profil -->
            <div id="profileTab" class="hidden">
                <input type="text" id="profileName" placeholder="Nom d'utilisateur">
                <textarea id="profileBio" placeholder="Bio / Description" rows="3"></textarea>
                <input type="text" id="profilePhone" placeholder="Téléphone (Orange Money)">
                <button id="saveProfileBtn">💾 Enregistrer</button>
                <hr style="margin:16px 0; border-color:#334155;">
                <h3 style="font-size:16px;">💰 Recharger mon compte</h3>
                <input type="number" id="rechargeAmount" placeholder="Montant (FCFA)" value="1000">
                <button id="rechargeBtn" class="warning">📱 Recharger par Orange Money</button>
                <div id="rechargeCode" style="margin-top:12px; font-size:12px; color:#94a3b8;"></div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    // ========== CONFIGURATION ==========
    const SUPABASE_URL = 'https://nuijvjnufnaodwtrhjuq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Z3l5W3VqqpSeFz6azxmrkw_fAZmT-iH';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // État
    let currentUser = null;
    let currentPosition = null;
    let watchId = null;
    let map = null;
    let userMarkers = [];
    let nearbyUsers = [];
    let userBalance = 0;
    let currentChatWith = null;
    
    // ========== FONCTIONS GÉNÉRALES ==========
    function showNotification(msg, isError = false) {
        const notif = document.createElement('div');
        notif.className = 'notification';
        notif.style.background = isError ? '#ef4444' : '#22c55e';
        notif.innerHTML = msg;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3000);
    }
    
    function formatDistance(d) {
        if (d < 1) return `${(d * 1000).toFixed(0)} m`;
        return `${d.toFixed(1)} km`;
    }
    
    function getDistance(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLng/2) * Math.sin(dLng/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    
    // ========== PHOTOS DE PROFIL ==========
    async function uploadAvatar(file) {
        if (!currentUser) return;
        const ext = file.name.split('.').pop();
        const fileName = `${currentUser.id}_${Date.now()}.${ext}`;
        const { error } = await supabase.storage.from('avatars').upload(fileName, file);
        if (error) { showNotification("Erreur upload", true); return; }
        const { data: { publicUrl } } = supabase.storage.from('avatars').getPublicUrl(fileName);
        await supabase.from('profiles').update({ avatar_url: publicUrl }).eq('id', currentUser.id);
        document.getElementById('profileAvatar').innerHTML = `<img src="${publicUrl}">`;
        showNotification("Photo mise à jour !");
        loadNearbyUsers();
        return publicUrl;
    }
    
    // ========== PAIEMENT SIMULÉ ORANGE MONEY ==========
    async function rechargeAccount(amount) {
        if (!currentUser) return;
        const phone = document.getElementById('profilePhone').value;
        if (!phone) {
            showNotification("Ajoutez votre numéro Orange Money dans votre profil", true);
            return;
        }
        
        // Générer code de transaction
        const transactionCode = Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
        const rechargeDiv = document.getElementById('rechargeCode');
        
        // Afficher les instructions
        rechargeDiv.innerHTML = `
            📱 <strong>Instructions Orange Money :</strong><br>
            1. Composez #144#<br>
            2. Envoyez ${amount} FCFA au +226${phone}<br>
            3. Code transaction: <strong style="color:#22c55e;">${transactionCode}</strong><br>
            4. Entrez le code ci-dessous pour valider<br>
            <input type="text" id="confirmCode" placeholder="Code de transaction" style="margin-top:8px;">
            <button id="confirmPaymentBtn" style="margin-top:4px;">✅ Confirmer paiement</button>
        `;
        
        document.getElementById('confirmPaymentBtn')?.addEventListener('click', async () => {
            const enteredCode = document.getElementById('confirmCode').value;
            if (enteredCode === transactionCode) {
                // Mettre à jour le solde
                const { data: profile } = await supabase.from('profiles').select('balance').eq('id', currentUser.id).single();
                const newBalance = (profile?.balance || 0) + amount;
                await supabase.from('profiles').update({ balance: newBalance }).eq('id', currentUser.id);
                userBalance = newBalance;
                document.getElementById('userBalance').innerHTML = `💰 ${userBalance} FCFA`;
                showNotification(`✅ ${amount} FCFA ajoutés !`);
                rechargeDiv.innerHTML = '';
            } else {
                showNotification("Code incorrect", true);
            }
        });
    }
    
    // ========== DÉBLOQUER AVEC PAIEMENT RÉEL ==========
    async function unlockUser(targetId, targetName, cost = 500) {
        if (userBalance < cost) {
            showNotification(`Solde insuffisant. Il vous faut ${cost} FCFA`, true);
            document.getElementById('profileTab').click();
            return;
        }
        
        if (!confirm(`Débloquer ${targetName} pour ${cost} FCFA ?`)) return;
        
        // Vérifier si déjà débloqué
        const { data: existing } = await supabase
            .from('unlocks')
            .select('id')
            .eq('buyer_id', currentUser.id)
            .eq('target_id', targetId)
            .maybeSingle();
        
        if (existing) {
            showNotification("Déjà débloqué !");
            return;
        }
        
        // Débiter le solde
        const newBalance = userBalance - cost;
        await supabase.from('profiles').update({ balance: newBalance }).eq('id', currentUser.id);
        userBalance = newBalance;
        document.getElementById('userBalance').innerHTML = `💰 ${userBalance} FCFA`;
        
        // Enregistrer le déblocage
        await supabase.from('unlocks').insert({ buyer_id: currentUser.id, target_id: targetId });
        
        showNotification(`✅ ${targetName} débloqué !`);
        loadNearbyUsers();
        
        // Envoyer une notification à la personne débloquée
        await supabase.from('notifications').insert({
            user_id: targetId,
            from_id: currentUser.id,
            message: `${currentUser.email?.split('@')[0]} vous a débloqué !`,
            type: 'unlock'
        });
    }
    
    // ========== MESSAGERIE ==========
    async function loadConversations() {
        const container = document.getElementById('conversationsList');
        container.innerHTML = '<div class="loading">Chargement...</div>';
        
        // Récupérer les déblocages (les gens qu'on a débloqués)
        const { data: unlocks } = await supabase
            .from('unlocks')
            .select('target_id')
            .eq('buyer_id', currentUser.id);
        
        const unlockedIds = unlocks?.map(u => u.target_id) || [];
        
        if (unlockedIds.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#94a3b8;">🔒 Débloquez des personnes pour chatter</div>';
            return;
        }
        
        const { data: profiles } = await supabase
            .from('profiles')
            .select('id, username, avatar_url')
            .in('id', unlockedIds);
        
        container.innerHTML = profiles?.map(p => `
            <div class="user-card" data-id="${p.id}" style="cursor:pointer;">
                <div class="user-card-avatar">
                    ${p.avatar_url ? `<img src="${p.avatar_url}">` : '<span style="display:flex;align-items:center;justify-content:center;height:100%;">👤</span>'}
                </div>
                <div style="flex:1;">
                    <div style="color:white;">${p.username}</div>
                </div>
                <button class="chat-btn" data-id="${p.id}" data-name="${p.username}" style="width:auto;">💬</button>
            </div>
        `).join('');
        
        document.querySelectorAll('.chat-btn').forEach(btn => {
            btn.addEventListener('click', () => startChat(btn.dataset.id, btn.dataset.name));
        });
    }
    
    async function startChat(userId, userName) {
        currentChatWith = userId;
        document.getElementById('chatWith').innerHTML = `💬 Discussion avec ${userName}`;
        document.getElementById('conversationsList').classList.add('hidden');
        document.getElementById('chatView').classList.remove('hidden');
        
        // Charger les messages
        const { data: messages } = await supabase
            .from('messages')
            .select('*')
            .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${currentUser.id})`)
            .order('created_at', { ascending: true });
        
        const container = document.getElementById('chatMessages');
        container.innerHTML = messages?.map(m => `
            <div class="message ${m.sender_id === currentUser.id ? 'sent' : 'received'}">
                ${m.message}
                <small>${new Date(m.created_at).toLocaleTimeString()}</small>
            </div>
        `).join('') || '<div style="text-align:center;color:#94a3b8;">Aucun message</div>';
        
        container.scrollTop = container.scrollHeight;
        
        // S'abonner aux nouveaux messages
        supabase
            .channel(`chat-${userId}`)
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `receiver_id=eq.${currentUser.id}` }, (payload) => {
                if (payload.new.sender_id === userId) {
                    const msgDiv = document.createElement('div');
                    msgDiv.className = 'message received';
                    msgDiv.innerHTML = `${payload.new.message}<small>${new Date().toLocaleTimeString()}</small>`;
                    container.appendChild(msgDiv);
                    container.scrollTop = container.scrollHeight;
                    showNotification(`📩 Nouveau message de ${userName}`);
                }
            })
            .subscribe();
    }
    
    async function sendMessage() {
        const msg = document.getElementById('messageInput').value.trim();
        if (!msg || !currentChatWith) return;
        
        await supabase.from('messages').insert({
            sender_id: currentUser.id,
            receiver_id: currentChatWith,
            message: msg
        });
        
        document.getElementById('messageInput').value = '';
        
        // Ajouter le message à l'affichage
        const container = document.getElementById('chatMessages');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message sent';
        msgDiv.innerHTML = `${msg}<small>Maintenant</small>`;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
    }
    
    // ========== CARTE ET GÉOLOCALISATION ==========
    function initMap() {
        if (map) return;
        map = L.map('map').setView([12.3714, -1.5197], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>'
        }).addTo(map);
    }
    
    async function loadNearbyUsers() {
        if (!currentPosition) return;
        
        const radius = parseFloat(document.getElementById('radiusKm').value);
        document.getElementById('radiusValue').innerHTML = `${radius} km`;
        
        const { data: profiles } = await supabase.from('profiles').select('id, username, avatar_url').neq('id', currentUser.id);
        const { data: locations } = await supabase.from('locations').select('user_id, lat, lng');
        const { data: unlocks } = await supabase.from('unlocks').select('target_id').eq('buyer_id', currentUser.id);
        
        const unlockedIds = new Set(unlocks?.map(u => u.target_id) || []);
        const locationMap = new Map(locations?.map(l => [l.user_id, { lat: l.lat, lng: l.lng }]));
        
        const users = [];
        for (const p of profiles) {
            const loc = locationMap.get(p.id);
            if (loc) {
                const dist = getDistance(currentPosition.lat, currentPosition.lng, loc.lat, loc.lng);
                if (dist <= radius) {
                    users.push({ ...p, lat: loc.lat, lng: loc.lng, distance: dist, isUnlocked: unlockedIds.has(p.id) });
                }
            }
        }
        users.sort((a,b) => a.distance - b.distance);
        nearbyUsers = users;
        
        // Mettre à jour la carte
        if (map) {
            userMarkers.forEach(m => map.removeLayer(m));
            userMarkers = [];
            
            L.marker([currentPosition.lat, currentPosition.lng], {
                icon: L.divIcon({ html: '<div style="background:#3b82f6;width:20px;height:20px;border-radius:50%;border:3px solid white;"></div>', iconSize: [20,20] })
            }).addTo(map).bindPopup('<b>Vous</b>');
            
            users.forEach(u => {
                const color = u.isUnlocked ? '#22c55e' : '#f59e0b';
                const m = L.marker([u.lat, u.lng], {
                    icon: L.divIcon({ html: `<div style="background:${color};width:20px;height:20px;border-radius:50%;border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:10px;">${u.username.charAt(0)}</div>`, iconSize: [20,20] })
                }).addTo(map);
                m.bindPopup(`
                    <div style="min-width:150px;">
                        <strong>${u.username}</strong><br>
                        📏 ${formatDistance(u.distance)}
                        ${!u.isUnlocked ? `<br><button onclick="window.unlockUserFromPopup('${u.id}','${u.username}')" style="background:#f59e0b;border:none;padding:6px;border-radius:20px;margin-top:8px;cursor:pointer;">🔓 Débloquer (500 FCFA)</button>` : '<br><span style="color:#22c55e;">✅ Débloqué</span>'}
                    </div>
                `);
                userMarkers.push(m);
            });
        }
        
        // Liste des utilisateurs
        const listContainer = document.getElementById('nearbyList');
        listContainer.innerHTML = users.map(u => `
            <div class="user-card">
                <div class="user-card-avatar">
                    ${u.avatar_url ? `<img src="${u.avatar_url}">` : '<span style="display:flex;align-items:center;justify-content:center;height:100%;">👤</span>'}
                </div>
                <div style="flex:1;">
                    <div style="color:white;">${u.username}</div>
                    <div style="font-size:12px; color:#94a3b8;">📏 ${formatDistance(u.distance)}</div>
                </div>
                ${u.isUnlocked ? 
                    '<span class="badge">✅ Débloqué</span>' : 
                    `<button class="unlock-list-btn" data-id="${u.id}" data-name="${u.username}" style="width:auto; padding:8px 16px;">🔓 ${u.distance < 1 ? '500' : '1000'} FCFA</button>`
                }
            </div>
        `).join('');
        
        document.querySelectorAll('.unlock-list-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const cost = parseFloat(btn.textContent.match(/\d+/)[0]);
                unlockUser(btn.dataset.id, btn.dataset.name, cost);
            });
        });
    }
    
    window.unlockUserFromPopup = (id, name) => unlockUser(id, name, 500);
    
    function startGeolocation() {
        if (!navigator.geolocation) { showNotification("GPS non supporté", true); return; }
        if (watchId) navigator.geolocation.clearWatch(watchId);
        watchId = navigator.geolocation.watchPosition(async (pos) => {
            currentPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            await supabase.from('locations').upsert({ user_id: currentUser.id, lat: currentPosition.lat, lng: currentPosition.lng });
            document.getElementById('gpsStatus').innerHTML = "✅ GPS actif";
            initMap();
            loadNearbyUsers();
        }, (err) => { showNotification("Erreur GPS", true); });
    }
    
    // ========== AUTHENTIFICATION ==========
    async function signUp() {
        const email = document.getElementById('email').value;
        const pwd = document.getElementById('password').value;
        if (!email || !pwd) { showNotification("Email et mot de passe requis", true); return; }
        const { error } = await supabase.auth.signUp({ email, password: pwd });
        if (error) showNotification(error.message, true);
        else showNotification("✅ Compte créé ! Connectez-vous");
    }
    
    async function login() {
        const email = document.getElementById('email').value;
        const pwd = document.getElementById('password').value;
        const { error } = await supabase.auth.signInWithPassword({ email, password: pwd });
        if (error) showNotification(error.message, true);
    }
    
    async function logout() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        await supabase.auth.signOut();
    }
    
    async function checkAuth() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user) {
            currentUser = session.user;
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            document.getElementById('userName').innerText = profile?.username || currentUser.email.split('@')[0];
            userBalance = profile?.balance || 0;
            document.getElementById('userBalance').innerHTML = `💰 ${userBalance} FCFA`;
            if (profile?.avatar_url) document.getElementById('profileAvatar').innerHTML = `<img src="${profile.avatar_url}">`;
            document.getElementById('profileName').value = profile?.username || '';
            document.getElementById('profileBio').value = profile?.bio || '';
            document.getElementById('profilePhone').value = profile?.phone || '';
            
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            
            const { data: location } = await supabase.from('locations').select('lat,lng').eq('user_id', currentUser.id).single();
            if (location) currentPosition = location;
        } else {
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('mainScreen').classList.add('hidden');
        }
    }
    
    // ========== INITIALISATION ==========
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('signupBtn').onclick = signUp;
        document.getElementById('loginBtn').onclick = login;
        document.getElementById('logoutBtn').onclick = logout;
        document.getElementById('enableGpsBtn').onclick = startGeolocation;
        document.getElementById('radiusKm').oninput = (e) => { document.getElementById('radiusValue').innerHTML = `${e.target.value} km`; loadNearbyUsers(); };
        document.getElementById('saveProfileBtn').onclick = async () => {
            await supabase.from('profiles').update({
                username: document.getElementById('profileName').value,
                bio: document.getElementById('profileBio').value,
                phone: document.getElementById('profilePhone').value
            }).eq('id', currentUser.id);
            showNotification("Profil mis à jour !");
        };
        document.getElementById('rechargeBtn').onclick = () => rechargeAccount(parseInt(document.getElementById('rechargeAmount').value));
        document.getElementById('sendMsgBtn').onclick = sendMessage;
        document.getElementById('closeChatBtn').onclick = () => {
            document.getElementById('conversationsList').classList.remove('hidden');
            document.getElementById('chatView').classList.add('hidden');
            loadConversations();
        };
        document.getElementById('avatarInput').onchange = (e) => uploadAvatar(e.target.files[0]);
        
        // Tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.onclick = () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('mapTab').classList.add('hidden');
                document.getElementById('messagesTab').classList.add('hidden');
                document.getElementById('profileTab').classList.add('hidden');
                if (tab.dataset.tab === 'map') { document.getElementById('mapTab').classList.remove('hidden'); loadNearbyUsers(); }
                if (tab.dataset.tab === 'messages') { document.getElementById('messagesTab').classList.remove('hidden'); loadConversations(); }
                if (tab.dataset.tab === 'profile') { document.getElementById('profileTab').classList.remove('hidden'); }
            };
        });
        
        supabase.auth.onAuthStateChange(() => checkAuth());
        checkAuth();
    });
})();
</script>
</body>
</html>
